<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-950 text-slate-100">
<header class="sticky top-0 z-40 backdrop-blur bg-slate-950/80 border-b border-slate-800">
<div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
<a href="index.html" class="font-extrabold text-lg">🏠 <span data-config="agencyName">Emmy's Agency</span></a>
<nav class="flex gap-5 text-sm font-semibold"><a class="hover:text-emerald-400" href="index.html">Home</a><a class="hover:text-emerald-400" href="universities.html">Universities</a><a class="hover:text-emerald-400" href="about.html">About</a><a class="bg-emerald-500 text-slate-950 px-4 py-1.5 rounded-full" href="contact.html">Contact</a></nav>
</div></header>
<main class="max-w-6xl mx-auto px-5 py-12 pb-24">

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5 mt-8" id="uni-grid"></div>
<ul class="hidden" id="uni-list"></ul>

</main>
<a id="wa-float" href="#" target="_blank">💬 WhatsApp us</a>

<script src="site-config.js"></script><script src="app.js"></script>
<script>
// render modern cards from same config (keeps #uni-list for app.js compat)
const c = window.SITE_CONFIG || {}; const g = document.getElementById('uni-grid');
if (g && c.universities) g.innerHTML = c.universities.map(u => `<div class="card-mod"><h4>🎓 ${u}</h4><p>Rooms nearby — ask on WhatsApp.</p></div>`).join('');
</script>
