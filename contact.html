<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Emmy's Agency</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-950 text-slate-100">
<header class="sticky top-0 z-40 backdrop-blur bg-slate-950/80 border-b border-slate-800">
<div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
<a href="index.html" class="font-extrabold text-lg">🏠 <span data-config="agencyName">Emmy's Agency</span></a>
<nav class="flex gap-5 text-sm font-semibold"><a class="hover:text-emerald-400" href="index.html">Home</a><a class="hover:text-emerald-400" href="universities.html">Universities</a><a class="hover:text-emerald-400" href="about.html">About</a><a class="bg-emerald-500 text-slate-950 px-4 py-1.5 rounded-full" href="contact.html">Contact</a></nav>
</div></header>
<main class="max-w-3xl mx-auto px-5 py-12 pb-24">
<span class="badge">Contact</span>
<h1 class="text-4xl font-extrabold mt-3">Get housing help</h1>
<p class="text-slate-400 mt-2">Minimal details only. <span data-config="email"></span> • <span data-config="whatsapp"></span></p>
<div class="card-mod mt-6"><form id="lead-form" class="space-y-4">
<div><label class="lbl">Full name</label><input class="inp" name="name" required autocomplete="name" placeholder="Your full name"></div>
<div><label class="lbl">Phone or Email</label><input class="inp" name="contact" required placeholder="+90 ... or you@email.com"></div>
<div><label class="lbl">University</label><select class="inp" name="university" id="uni-select" required></select></div>
<div><label class="lbl">Message</label><textarea class="inp" name="message" rows="4" required placeholder="e.g. Need room near campus from September"></textarea></div>
<label class="text-sm text-slate-400 flex gap-2 items-start"><input type="checkbox" required class="mt-1"> I consent to being contacted about housing.</label>
<button class="w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl hover:bg-emerald-400" type="submit">Send enquiry</button>
<p id="form-status" class="text-sm text-slate-400"></p>
</form></div>
</main>
<a id="wa-float" href="#" target="_blank">💬 WhatsApp us</a>
<footer class="border-t border-slate-800 text-center py-6 text-slate-500 text-sm"><span data-config="agencyName"></span></footer>
<script src="site-config.js"></script><script src="app.js"></script>
</body></html>
